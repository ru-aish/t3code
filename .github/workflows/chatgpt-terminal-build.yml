name: ChatGPT web and server preview
on:
  push:
    branches: [feat/chatgpt-terminal-provider]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chatgpt-terminal-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Test ChatGPT thread reconciliation
        run: >-
          vp test run
          apps/server/src/chatgpt/connection.test.ts
          apps/server/src/chatgpt/adapter.test.ts
          apps/server/src/chatgpt/protocol.test.ts
          apps/server/src/chatgpt/driver.test.ts
          apps/web/src/components/chat/ModelPickerContent.test.ts
          apps/web/src/components/chat/ChatGPTThreadControls.test.tsx
          apps/web/src/components/chat/ThreadDetailsPanel.test.tsx
          apps/server/src/auth/RpcAuthorization.test.ts
          packages/client-runtime/src/state/commandPermissions.test.ts
      - run: vp run --filter t3 --filter @t3tools/web typecheck
      - name: Build production web and server bundles
        run: |
          vp run --filter @t3tools/web build
          vp run --filter t3 build:bundle
          mkdir -p apps/server/dist/client
          cp -a apps/web/dist/. apps/server/dist/client/
          printf 'commit=%s\nworkflow_run=%s\nrepository=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" > apps/server/dist/BUILD_INFO.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t3-chatgpt-thread-refresh-web
          path: apps/server/dist
          if-no-files-found: error
          retention-days: 7
