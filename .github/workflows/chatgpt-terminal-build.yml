name: ChatGPT Terminal preview
on:
  push:
    branches: [feat/chatgpt-terminal-provider]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chatgpt-terminal-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: vp test run apps/server/src/chatgpt/connection.test.ts apps/server/src/chatgpt/adapter.test.ts apps/server/src/chatgpt/protocol.test.ts apps/web/src/components/chat/ModelPickerContent.test.ts
      - run: vp run --filter t3 --filter @t3tools/web typecheck
      - run: vp run build:desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t3-chatgpt-nightly-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 7
