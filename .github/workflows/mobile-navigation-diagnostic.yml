name: Mobile Navigation Diagnostic
on:
  push:
    branches: [diag/mobile-native-stack-64c91df]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - name: Install mobile dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/mobile...
      - name: Inspect exact navigation packages
        working-directory: apps/mobile
        run: |
          set -euxo pipefail
          for pattern in '@react-navigation+native@' '@react-navigation+core@' '@react-navigation+routers@' '@react-navigation+native-stack@'; do
            echo "=== $pattern package.json ==="
            find ../../node_modules/.pnpm -maxdepth 1 -type d -name "$pattern*" -print | head -20
          done
          echo '=== native package json ==='
          find ../../node_modules/.pnpm -path '*react-navigation+native@7.5.1*' -type f -path '*/@react-navigation/native/package.json' -print -exec cat {} \; | head -260
          echo '=== core package json ==='
          find ../../node_modules/.pnpm -path '*react-navigation+core@*' -type f -path '*/@react-navigation/core/package.json' -print -exec cat {} \; | head -320
          echo '=== routers package json ==='
          find ../../node_modules/.pnpm -path '*react-navigation+routers@*' -type f -path '*/@react-navigation/routers/package.json' -print -exec cat {} \; | head -280
          echo '=== useNavigationBuilder implementation ==='
          find ../../node_modules/.pnpm -path '*react-navigation+core@*' -type f -name 'useNavigationBuilder.js' -print -exec sed -n '1,420p' {} \; | head -1400
          echo '=== native exports around useNavigationBuilder ==='
          grep -R -n --include='*.js' 'useNavigationBuilder' ../../node_modules/.pnpm/@react-navigation+native@7.5.1* ../../node_modules/.pnpm/@react-navigation+core@* | head -120
          echo '=== createNativeStackNavigator exact implementation ==='
          find ../../node_modules/.pnpm -path '*react-navigation+native-stack@7.21.0*' -type f -name 'createNativeStackNavigator.js' -print -exec sed -n '1,220p' {} \; | head -700
