name: Mobile Navigation Diagnostic
on:
  push:
    branches: [diag/mobile-native-stack-64c91df]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - name: Install mobile dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/mobile...
      - name: Inspect navigation dependency graph and implementation
        working-directory: apps/mobile
        run: |
          set -euxo pipefail
          pnpm list @react-navigation/native @react-navigation/core @react-navigation/routers @react-navigation/native-stack react-native-screens --depth 3 || true
          echo '--- package versions ---'
          for pkg in '@react-navigation/native' '@react-navigation/core' '@react-navigation/routers' '@react-navigation/native-stack' 'react-native-screens'; do
            file="$(find ../../node_modules/.pnpm -path "*/node_modules/$pkg/package.json" -print -quit)"
            echo "$pkg package=$file"
            node -e "const fs=require('fs'); const p=process.argv[1]; const j=JSON.parse(fs.readFileSync(p,'utf8')); console.log(j.name,j.version,j.peerDependencies||{})" "$file"
          done
          echo '--- native stack navigator implementation ---'
          find ../../node_modules/.pnpm -path '*react-navigation+native-stack*' -type f \( -name 'createNativeStackNavigator.js' -o -name 'createNativeStackNavigator.tsx' \) -print -exec sed -n '1,260p' {} \; | head -1000
          echo '--- navigation builder implementation ---'
          find ../../node_modules/.pnpm -path '*react-navigation+core*' -type f \( -name 'useNavigationBuilder.js' -o -name 'useNavigationBuilder.tsx' -o -name 'useNavigationBuilder.ts' \) -print -exec sed -n '1,320p' {} \; | head -1400
