name: Mobile Navigation Diagnostic
on:
  push:
    branches: [diag/mobile-native-stack-64c91df]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - name: Install mobile dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/mobile...
      - name: Inspect builder return and native stack
        working-directory: apps/mobile
        run: |
          set -euxo pipefail
          echo '=== useNavigationBuilder tail ==='
          find ../../node_modules/.pnpm -path '*react-navigation+core@7.21.13*' -type f -name 'useNavigationBuilder.js' -print -exec sed -n '520,700p' {} \; | head -900
          echo '=== createNativeStackNavigator ==='
          find ../../node_modules/.pnpm -path '*react-navigation+native-stack@7.21.0*' -type f -name 'createNativeStackNavigator.js' -print -exec sed -n '1,180p' {} \; | head -500
          echo '=== native StackRouter export ==='
          grep -R -n --include='*.js' 'StackRouter' ../../node_modules/.pnpm/@react-navigation+native@7.5.1* ../../node_modules/.pnpm/@react-navigation+routers@7.6.4* | head -100
