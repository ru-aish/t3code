name: Mobile Navigation Diagnostic
on:
  push:
    branches: [diag/mobile-native-stack-64c91df]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - name: Install mobile dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/mobile...
      - name: Typecheck Android navigation adapter
        run: vp run --filter @t3tools/mobile typecheck
      - name: Generate production Metro bundle
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          NODE_ENV: production
          EXPO_NO_GIT_STATUS: '1'
        run: |
          set -euxo pipefail
          mkdir -p ../../diagnostic/assets
          pnpm exec expo export:embed \
            --entry-file index.ts \
            --platform android \
            --dev false \
            --minify true \
            --bundle-output ../../diagnostic/index.android.bundle \
            --assets-dest ../../diagnostic/assets
          test -s ../../diagnostic/index.android.bundle
          wc -c ../../diagnostic/index.android.bundle
      - name: Verify local navigator uses NavigationContent
        run: |
          set -euxo pipefail
          grep -n 'NavigationContent' apps/mobile/src/native/createV5StackNavigator.tsx
          ! grep -n 'return render' apps/mobile/src/native/createV5StackNavigator.tsx
