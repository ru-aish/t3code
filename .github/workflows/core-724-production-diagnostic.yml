name: Core 7.24 Production Diagnostic
on:
  push:
    branches: [diag/core-724-production-head]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - name: Frozen mobile install
        run: vp install --frozen-lockfile --filter=@t3tools/mobile...
      - name: Verify installed navigation core contract
        working-directory: apps/mobile
        run: |
          set -euxo pipefail
          file="$(find ../../node_modules/.pnpm -path '*/node_modules/@react-navigation/core/package.json' -print -quit)"
          cat "$file"
          impl="$(dirname "$file")/lib/module/useNavigationBuilder.js"
          grep -n -E 'NavigationContent|render' "$impl" | tail -40
          grep -q 'render:' "$impl" || grep -q 'render,' "$impl"
