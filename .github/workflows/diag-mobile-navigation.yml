name: Diagnose Mobile Navigation Runtime
on:
  push:
    branches: [diag/mobile-nav-runtime-a472fa2]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - name: Install mobile dependencies
        run: vp install --no-frozen-lockfile --filter=@t3tools/mobile...
      - name: Print resolved navigation packages
        run: |
          set -eu
          echo '--- resolved package.json files ---'
          find node_modules/.pnpm -path '*/node_modules/@react-navigation/*/package.json' -type f | sort | while read p; do
            node -e "const j=require('./' + process.argv[1]); console.log(process.argv[1], j.version)" "$p"
          done
          echo '--- native-stack navigator ---'
          ns=$(find node_modules/.pnpm -path '*/node_modules/@react-navigation/native-stack/lib/module/navigators/createNativeStackNavigator.js' -type f | head -1)
          echo "native_stack_file=$ns"
          sed -n '1,220p' "$ns"
          echo '--- core useNavigationBuilder ---'
          core=$(find node_modules/.pnpm -path '*/node_modules/@react-navigation/core/lib/module/useNavigationBuilder.js' -type f | head -1)
          echo "core_file=$core"
          sed -n '1,320p' "$core"
          echo '--- native index export ---'
          nat=$(find node_modules/.pnpm -path '*/node_modules/@react-navigation/native/lib/module/index.js' -type f | head -1)
          echo "native_index=$nat"
          grep -n "useNavigationBuilder" "$nat" || true
          echo '--- lock navigation entries ---'
          grep -n -A30 -B5 "'@react-navigation/core@" pnpm-lock.yaml | head -200
